<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Invitación · KPK Wellness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* La invitación que el anfitrión comparte con sus invitados. Sale de la
     cotización, pero sin precios ni condiciones: solo lo que un invitado
     necesita saber y las ganas de ir. */
  :root {
    --tinta: #1F2024; --tinta-sueve: #5C5E66; --arena: #D9C9AE; --arena-hond: #B9A47F;
    --eucalipto: #7A9E8E; --eucalipto-h: #4F7566; --crema: #F7F5F1; --papel: #FFFFFF; --linea: #E6E1D8;
    --display: 'Cormorant Garamond', Georgia, serif; --texto: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--crema); color: var(--tinta); font-family: var(--texto); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  .hoja { max-width: 640px; margin: 0 auto; background: var(--papel); box-shadow: 0 0 0 1px var(--linea); min-height: 100svh; }
  .portada { position: relative; isolation: isolate; color: #fff; min-height: clamp(420px, 78vw, 560px); display: flex; flex-direction: column; justify-content: flex-end; padding: 28px 26px 30px; overflow: hidden; background: var(--tinta); }
  .portada .foto { position: absolute; inset: 0; z-index: -2; background: center / cover no-repeat; animation: respira 28s ease-in-out infinite alternate; }
  .portada::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(20,21,26,0.18) 0%, rgba(20,21,26,0) 35%, rgba(20,21,26,0.78) 100%); }
  @keyframes respira { from { transform: scale(1.02); } to { transform: scale(1.1); } }
  .filo { width: 40px; height: 2px; background: var(--eucalipto); margin-bottom: 14px; }
  .etq { font-size: 10.5px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--arena); }
  h1 { font-family: var(--display); font-weight: 600; font-size: clamp(2.4rem, 10vw, 3.6rem); line-height: 0.98; letter-spacing: -0.012em; margin: 8px 0 10px; text-wrap: balance; text-shadow: 0 2px 22px rgba(0,0,0,0.35); }
  .anfitrion { color: #EDE7DB; font-size: 0.98rem; }
  .anfitrion b { color: #fff; font-weight: 600; }
  .datos { padding: 22px 26px; display: grid; gap: 14px 22px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); border-bottom: 1px solid var(--linea); }
  .datos .etq { color: var(--eucalipto-h); }
  .datos .val { font-family: var(--display); font-weight: 600; font-size: 1.3rem; line-height: 1.15; }
  .cuerpo { padding: 26px; display: grid; gap: 26px; }
  .mensaje { font-family: var(--display); font-size: 1.45rem; font-style: italic; line-height: 1.3; color: var(--tinta); margin: 0; }
  h2 { font-family: var(--display); font-weight: 600; font-size: 1.6rem; margin: 0 0 12px; }
  .menu { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
  .platillo { border-radius: 12px; overflow: hidden; background: var(--crema); border: 1px solid var(--linea); }
  .platillo .img { aspect-ratio: 4 / 3; background: var(--arena) center / cover no-repeat; }
  .platillo .n { font-family: var(--display); font-weight: 600; font-size: 1.1rem; line-height: 1.15; padding: 10px 12px; }
  .acciones { display: flex; flex-wrap: wrap; gap: 10px; }
  .boton { font-family: var(--texto); font-weight: 600; font-size: 0.92rem; border-radius: 999px; padding: 12px 22px; border: 1px solid var(--tinta); background: var(--tinta); color: #fff; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .boton.claro { background: transparent; color: var(--tinta); }
  .boton.primario { background: var(--eucalipto-h); border-color: var(--eucalipto-h); }
  .wa-ico { width: 18px; height: 18px; fill: currentColor; flex: none; }
  .pie { border-top: 1px solid var(--linea); margin: 0 26px; padding: 18px 0 34px; font-size: 0.85rem; color: var(--tinta-sueve); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  /* El nombre de la chef lleva a su tarjeta de presentación. */
  .pie .chef { font-family: var(--display); font-size: 1.05rem; color: var(--tinta); text-decoration: none; border-bottom: 1px solid var(--eucalipto); }
  .pie .chef:hover { color: var(--eucalipto-h); }
  .switch { display: flex; justify-content: flex-end; padding: 10px 14px; }
  .switch button { font: inherit; font-family: var(--texto); font-weight: 600; font-size: 0.76rem; border: 1px solid var(--linea); background: transparent; color: var(--tinta-sueve); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .switch button[aria-pressed="true"] { background: var(--tinta); color: #fff; border-color: var(--tinta); }
  @media (prefers-reduced-motion: reduce) { .portada .foto { animation: none; } }
</style>
</head>
<body>
<div class="hoja" id="hoja"></div>
<script>
(function () {
  var WA = '<svg class="wa-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>';
  var PORTADA = "assets/cotizaciones/portada-rosarito.webp";
  var T = {
    es: { invitado: "Estás invitado", anfitrion: "Te invita", lugar: "Lugar", fecha: "Fecha", horario: "Hora", menu: "El menú",
          mensaje: "Será un placer tenerte con nosotros.", confirmar: "Confirmar asistencia", calendario: "Agregar a mi calendario",
          waTexto: "Hola, confirmo mi asistencia a", chef: "Catering por", sin: "No encontramos esta invitación." },
    en: { invitado: "You're invited", anfitrion: "Hosted by", lugar: "Where", fecha: "When", horario: "Time", menu: "The menu",
          mensaje: "We'd love to have you with us.", confirmar: "RSVP", calendario: "Add to my calendar",
          waTexto: "Hi! I'm confirming my attendance to", chef: "Catering by", sin: "We couldn't find this invitation." }
  };
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function tx(v, L) { if (v == null) return ""; if (typeof v === "string") return v; return String(v[L] || v[L === "es" ? "en" : "es"] || ""); }
  function digitos(s) { return String(s || "").replace(/\D/g, ""); }
  function ics(c, L) {
    if (!c.inicio) return "";
    var f = function (v) { return String(v).replace(/[-:]/g, "").slice(0, 15); };
    var l = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//KPK Wellness//Invitacion//ES", "BEGIN:VEVENT",
      "UID:" + c.slug + "-inv@kpk.associates", "DTSTART:" + f(c.inicio), "DTEND:" + f(c.fin || c.inicio),
      "SUMMARY:" + tx(c.titulo, L), "LOCATION:" + tx(c.lugar, L), "END:VEVENT", "END:VCALENDAR"];
    return "data:text/calendar;charset=utf-8," + encodeURIComponent(l.join("\r\n"));
  }
  var datos = null, L = "es";
  function pintar() {
    var t = T[L], hoja = $("#hoja");
    var slug = new URLSearchParams(location.search).get("c");
    var c = (datos && datos.cotizaciones || []).filter(function (x) { return x.slug === slug; })[0];
    if (!c) { hoja.innerHTML = '<div class="cuerpo"><p class="mensaje">' + esc(t.sin) + "</p></div>"; return; }
    var chef = datos.chef || {};
    document.title = tx(c.titulo, L) + " · " + t.invitado;
    var menu = (c.menu || []).map(function (p) {
      return '<div class="platillo"><div class="img"' + (p.imagen ? ' style="background-image:url(' + "'" + esc(p.imagen) + "'" + ')"' : "") + '></div><div class="n">' + esc(tx(p.nombre, L)) + "</div></div>";
    }).join("");
    var tel = digitos(c.telCliente);
    var rsvp = tel
      ? '<a class="boton primario" target="_blank" rel="noopener" href="https://wa.me/' + tel + "?text=" + encodeURIComponent(t.waTexto + " " + tx(c.titulo, L) + " — " + tx(c.fecha, L)) + '">' + WA + esc(t.confirmar) + "</a>"
      : "";
    var cal = ics(c, L) ? '<a class="boton claro" download="' + esc(c.slug) + '.ics" href="' + ics(c, L) + '">' + esc(t.calendario) + "</a>" : "";
    hoja.innerHTML =
      '<div class="switch"><button type="button" data-l="es" aria-pressed="' + (L === "es") + '">Español</button>&nbsp;<button type="button" data-l="en" aria-pressed="' + (L === "en") + '">English</button></div>' +
      '<header class="portada"><div class="foto" style="background-image:url(' + "'" + esc(c.portada || PORTADA) + "'" + ')"></div>' +
        '<div class="filo"></div><div class="etq">' + esc(t.invitado) + "</div><h1>" + esc(tx(c.titulo, L)) + "</h1>" +
        (c.cliente ? '<div class="anfitrion">' + esc(t.anfitrion) + " <b>" + esc(c.cliente) + "</b></div>" : "") +
      "</header>" +
      '<div class="datos">' +
        '<div><div class="etq">' + esc(t.fecha) + '</div><div class="val">' + esc(tx(c.fecha, L)) + "</div></div>" +
        '<div><div class="etq">' + esc(t.horario) + '</div><div class="val">' + esc(tx(c.horario, L)) + "</div></div>" +
        '<div><div class="etq">' + esc(t.lugar) + '</div><div class="val">' + esc(tx(c.lugar, L)) + "</div></div>" +
      "</div>" +
      '<div class="cuerpo">' +
        '<p class="mensaje">' + esc(tx(c.mensajeInvitacion, L) || t.mensaje) + "</p>" +
        (rsvp || cal ? '<div class="acciones">' + rsvp + cal + "</div>" : "") +
        (menu ? "<section><h2>" + esc(t.menu) + '</h2><div class="menu">' + menu + "</div></section>" : "") +
      "</div>" +
      '<div class="pie"><div>' + esc(t.chef) + ' <a class="chef" href="/card/">' + esc(chef.nombre || "Chef Karina Paz Kennedy") + "</a></div><div>kpk.associates</div></div>";
    Array.prototype.forEach.call(hoja.querySelectorAll("[data-l]"), function (b) {
      b.addEventListener("click", function () { L = b.getAttribute("data-l"); pintar(); });
    });
  }
  fetch("content/cotizaciones.json?t=" + Date.now()).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
    datos = d;
    var slug = new URLSearchParams(location.search).get("c");
    var c = (d && d.cotizaciones || []).filter(function (x) { return x.slug === slug; })[0];
    if (c && c.idioma === "en") L = "en";
    pintar();
  }).catch(function () { pintar(); });
}());
</script>
</body>
</html>
