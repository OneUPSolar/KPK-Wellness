<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecting Spotify… | School of Open Yoga</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body style="display:flex; justify-content:center; align-items:center; height:100vh; background:var(--bg);">

  <div style="text-align:center; color:var(--ink-dim); font-family:var(--font-mono); font-size:0.85rem;">
    <div class="particle" style="position:relative; width:20px; height:20px; margin:0 auto 1.5rem; animation:float 2s infinite;"></div>
    Connecting Spotify…
  </div>

  <!-- The exchange logic runs as a module so it can import SpotifyProvider -->
  <script type="module">
    import { SpotifyProvider } from './providers/spotify.js';

    async function handleCallback() {
      const code = new URLSearchParams(window.location.search).get('code');

      if (!code) {
        // Nothing to exchange — go back to the studio
        window.location.href = '/yoga/live/';
        return;
      }

      try {
        await SpotifyProvider.exchangeCode(code);
        window.location.href = '/yoga/live/';
      } catch (err) {
        console.error('[callback] Token exchange failed:', err);
        document.body.innerHTML = `
          <div style="color:var(--accent-warm); font-family:var(--font-body); text-align:center;">
            <p>Failed to connect to Spotify.</p>
            <a href="/yoga/live/" style="color:var(--ink); text-decoration:underline; margin-top:1rem; display:inline-block;">
              Return to Studio
            </a>
          </div>`;
      }
    }

    handleCallback();
  </script>

</body>
</html>
