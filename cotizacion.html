<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Enlace privado: se comparte con el cliente, no se indexa. -->
<meta name="robots" content="noindex, nofollow">
<title>Cotización · KPK Wellness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: one scrolling quote. The switch at the top flips language AND the
     money side with it — Spanish in pesos with factura, English in dollars
     with an invoice. Single committed look: a quote reads the same for every
     client. */
  :root {
    /* La misma marca que el sitio y la app: papel, tinta, eucalipto y arena. */
    --tinta:      #1F2024;
    --tinta-sueve:#5C5E66;
    --arena:      #D9C9AE;
    --arena-hond: #B9A47F;
    --eucalipto:  #7A9E8E;
    --eucalipto-h:#4F7566;
    --crema:      #F7F5F1;
    --papel:      #FFFFFF;
    --linea:      #E6E1D8;

    --display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    --texto:   'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

    color-scheme: light;
  }

  * { box-sizing: border-box; }
  /* `hidden` manda aunque la clase ponga display: así una caja vacía nunca se asoma. */
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--crema); color: var(--tinta);
    font-family: var(--texto); font-size: 15px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .cifra { font-family: var(--display); font-weight: 600; letter-spacing: -0.005em; }
  .etq {
    font-family: var(--texto); font-size: 10.5px; font-weight: 600; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--eucalipto-h);
  }

  .hoja { max-width: 900px; margin: 0 auto; background: var(--crema); box-shadow: 0 0 0 1px var(--linea); }

  /* ---------- interruptor de idioma y moneda ---------- */
  .switch {
    display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
    justify-content: space-between;
    padding: 12px 26px; background: var(--papel); color: var(--tinta-sueve);
    border-bottom: 1px solid var(--linea);
  }
  .switch .leyenda { font-size: 0.8rem; min-width: 0; }
  .switch .grupo { display: flex; gap: 2px; background: var(--crema); border: 1px solid var(--linea); border-radius: 999px; padding: 3px; }
  .switch button {
    font: inherit; font-family: var(--texto); font-weight: 600; font-size: 0.78rem; letter-spacing: 0.02em;
    border: 0; background: transparent; color: var(--tinta-sueve); cursor: pointer;
    border-radius: 999px; padding: 6px 15px; white-space: nowrap;
  }
  .switch button[aria-pressed="true"] { background: var(--tinta); color: #fff; }
  .switch button:focus-visible { outline: 2px solid var(--eucalipto); outline-offset: 2px; }

  /* ---------- portada ---------- */
  /* La foto manda. Dos capas de degradado: una para que el título se lea,
     otra para que la foto no se apague. */
  .cabeza {
    position: relative; isolation: isolate; color: #fff;
    min-height: clamp(360px, 56vw, 520px);
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
    gap: 18px 24px; padding: 34px 26px 30px; overflow: hidden; background: var(--tinta);
  }
  .cabeza .foto {
    position: absolute; inset: 0; z-index: -2; background-size: cover; background-position: center;
    transform: scale(1.02);
  }
  .cabeza::before {
    content: ''; position: absolute; inset: 0; z-index: -1;
    background:
      linear-gradient(180deg, rgba(20,21,26,0.28) 0%, rgba(20,21,26,0) 35%, rgba(20,21,26,0.72) 100%),
      linear-gradient(90deg, rgba(20,21,26,0.35) 0%, rgba(20,21,26,0) 60%);
  }
  .cabeza .etq { color: var(--arena); }
  .cabeza h1 {
    margin: 8px 0 10px; font-size: clamp(2.3rem, 7.4vw, 4rem);
    font-weight: 600; line-height: 0.98; letter-spacing: -0.012em;
    text-wrap: balance; color: #fff; text-shadow: 0 2px 22px rgba(0,0,0,0.35);
  }
  .para { font-size: 1rem; color: #EDE7DB; }
  .para b { color: #fff; font-weight: 600; }
  .firma { text-align: right; min-width: 0; font-size: 0.86rem; color: #DDD6C8; }
  .firma .nombre { font-family: var(--display); font-weight: 600; font-size: 1.35rem; color: #fff; line-height: 1.1; }
  .filo { width: 40px; height: 2px; background: var(--eucalipto); margin-bottom: 14px; }

  /* ---------- banda de datos ---------- */
  .banda {
    background: var(--papel); color: var(--tinta); border-bottom: 1px solid var(--linea);
    padding-block: 18px; padding-inline: 26px;
    display: grid; gap: 14px 22px;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  }
  .banda .dato .val { font-family: var(--display); font-weight: 600; font-size: 1.25rem; line-height: 1.15; }

  /* ---------- secciones ---------- */
  .cuerpo { padding-block: 30px 40px; padding-inline: 24px; display: grid; gap: 34px; }
  section { display: grid; gap: 14px; }
  .titulo-fila {
    display: flex; flex-wrap: wrap; gap: 8px 16px;
    align-items: baseline; justify-content: space-between;
  }
  .titulo-fila h2 { margin: 0; font-size: 1.35rem; font-weight: 700; }
  .nota-fila { font-family: var(--texto); font-weight: 500; font-size: 0.84rem; color: var(--tinta-sueve); }

  .rejilla-2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(255px, 1fr)); }
  /* ---------- carrusel del menú ----------
     Scroll nativo con snap: funciona con el dedo, con la rueda y con teclado
     aunque el JS no corra. El JS solo agrega flechas, puntos y el avance suave. */
  .carrusel { position: relative; margin-inline: -24px; overflow: hidden; }
  .pista {
    display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory;
    padding: 4px 24px 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    scroll-padding-inline: 24px;
  }
  .pista::-webkit-scrollbar { display: none; }
  .pista .platillo { flex: 0 0 min(78%, 380px); scroll-snap-align: start; }
  @media (min-width: 720px) { .pista .platillo { flex-basis: calc(50% - 7px); } }
  .flechas { display: none; position: absolute; inset: 0 24px auto 24px; top: 50%; pointer-events: none; justify-content: space-between; transform: translateY(-80%); }
  @media (hover: hover) and (min-width: 720px) { .flechas { display: flex; } }
  .flecha {
    pointer-events: auto; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--linea);
    background: rgba(255,255,255,0.92); color: var(--tinta); cursor: pointer; font-size: 0; display: grid; place-items: center;
    box-shadow: 0 6px 18px rgba(31,32,36,0.14); transition: transform 0.15s ease, background 0.15s ease;
  }
  .flecha:hover { background: #fff; transform: scale(1.06); }
  .flecha::before { content: ''; width: 9px; height: 9px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(-45deg) translate(-1px, 1px); }
  .flecha.prev::before { transform: rotate(135deg) translate(-1px, 1px); }
  .puntos { display: flex; justify-content: center; gap: 7px; padding-top: 6px; }
  .nota-fotos { margin: 4px 0 0; font-size: 0.78rem; color: var(--tinta-sueve); text-align: center; }
  .punto { width: 7px; height: 7px; border-radius: 50%; border: 0; padding: 0; background: var(--linea); cursor: pointer; transition: transform 0.2s ease, background 0.2s ease; }
  .punto[aria-current="true"] { background: var(--eucalipto); transform: scale(1.35); }

  .titulo-fila h2 { font-size: 1.75rem; }
  .platillo {
    background: var(--papel); border: 1px solid var(--linea); border-radius: 14px;
    overflow: hidden; min-width: 0; display: grid;
  }
  .platillo .foto {
    position: relative; aspect-ratio: 4 / 3; overflow: hidden; isolation: isolate;
    background: var(--arena); display: grid; align-items: end;
  }
  .platillo .foto .img {
    position: absolute; inset: 0; z-index: -1; background: center / cover no-repeat;
    transition: transform 0.9s cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  .platillo:hover .foto .img { transform: scale(1.05); }
  /* El nombre vive sobre la foto, como en una carta. */
  .platillo .n {
    font-family: var(--display); font-weight: 600; font-size: 1.55rem; line-height: 1.08; color: #fff;
    padding: 46px 16px 14px; text-shadow: 0 1px 14px rgba(0,0,0,0.45);
    background: linear-gradient(180deg, rgba(20,21,26,0) 0%, rgba(20,21,26,0.62) 100%);
  }
  /* Sin foto todavía: un lienzo de arena con la inicial, no un hueco. */
  .platillo .foto.vacia { background: linear-gradient(135deg, var(--arena) 0%, var(--arena-hond) 100%); }
  .platillo .foto.vacia .inicial {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--display); font-size: 4rem; color: rgba(255,255,255,0.8); z-index: -1;
  }
  .platillo .txt { padding: 12px 16px 14px; min-height: 48px; }
  .platillo .d { font-size: 0.9rem; color: var(--tinta-sueve); }

  /* ---------- movimiento ----------
     Un solo momento orquestado: la portada respira y el menú avanza; lo demás
     entra al hacer scroll. Con "reducir movimiento" todo queda quieto. */
  @keyframes respira { from { transform: scale(1.02); } to { transform: scale(1.1); } }
  .cabeza .foto { animation: respira 28s ease-in-out infinite alternate; will-change: transform; }
  .boton, .pagar { transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease; }
  .boton:hover, .pagar:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(31,32,36,0.14); }
  @media (prefers-reduced-motion: reduce) {
    .cabeza .foto { animation: none; }
    .platillo .foto .img, .boton, .pagar { transition: none; }
  }

  /* ---------- precio ---------- */
  .precio {
    background: var(--tinta); border-radius: 14px; color: #fff;
    padding: 26px 28px; display: flex; flex-wrap: wrap;
    gap: 18px 26px; align-items: flex-end; justify-content: space-between;
    background-image: radial-gradient(120% 140% at 100% 0%, rgba(122,158,142,0.28) 0%, rgba(122,158,142,0) 55%);
  }
  .precio .etq { color: var(--arena); }
  .cifra {
    font-size: clamp(2.2rem, 7.5vw, 3.4rem); font-weight: 600;
    line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
  }
  .cifra.oro { color: var(--arena); }
  .precio .col-der { text-align: right; min-width: 0; }

  /* ---------- incluye ---------- */
  .incluye { display: grid; gap: 0 26px; grid-template-columns: repeat(auto-fit, minmax(255px, 1fr)); }
  .incluye div {
    padding: 11px 0; border-bottom: 1px solid var(--linea);
    font-size: 0.96rem; min-width: 0;
  }

  /* ---------- cajas ---------- */
  .caja {
    border: 1px solid var(--linea); background: var(--papel); border-radius: 12px;
    padding: 16px 18px; display: grid; gap: 8px; align-content: start; min-width: 0;
  }
  .caja .par b { font-family: var(--display); font-weight: 600; display: block; }
  .caja .par span { font-size: 0.92rem; color: var(--tinta-sueve); }
  .caja ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; }
  .caja li { font-size: 0.92rem; color: var(--tinta-sueve); }

  /* ---------- forma de pago ---------- */
  .pago { background: var(--papel); border: 1px solid var(--linea); border-radius: 14px; overflow: hidden; }
  .pago-cabeza {
    background: var(--eucalipto); color: #fff; padding: 18px 22px;
    display: flex; flex-wrap: wrap; gap: 10px 20px;
    align-items: baseline; justify-content: space-between;
  }
  .pago-cabeza .etq { color: #EAF1ED; }
  .pago-cabeza h2 { margin: 0; font-size: 1.55rem; color: #fff; }
  .pago-cabeza .monto { font-family: var(--display); font-weight: 600; font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; text-align: right; }
  .pago-cabeza .monto-nota { font-size: 0.76rem; color: #EAF1ED; text-align: right; margin-top: 4px; }
  .pago-cuerpo { padding: 18px 20px; display: grid; gap: 14px; }

  .acciones { display: flex; flex-wrap: wrap; gap: 10px; padding-bottom: 4px; }
  .boton {
    font-family: var(--texto); font-weight: 600; font-size: 0.9rem;
    border-radius: 999px; padding: 11px 22px; border: 1px solid var(--tinta);
    background: var(--tinta); color: #fff; text-decoration: none;
    display: inline-block; cursor: pointer;
  }
  .boton:hover { background: #2B2C2E; }
  .boton.claro { background: transparent; color: var(--tinta); }
  .boton.claro:hover { background: var(--crema); }

  /* Desplegable nativo: funciona con teclado y sin JavaScript. */
  .formas { border-top: 1px solid var(--linea); padding-top: 14px; }
  .formas summary {
    cursor: pointer; list-style: none; display: flex; align-items: center; gap: 9px;
    font-family: var(--texto); font-weight: 600; font-size: 0.92rem; color: var(--tinta);
  }
  .formas summary::-webkit-details-marker { display: none; }
  .formas summary::after {
    content: ''; width: 7px; height: 7px; margin-left: 2px;
    border-right: 2px solid var(--arena-hond); border-bottom: 2px solid var(--arena-hond);
    transform: rotate(45deg) translate(-2px, -2px); transition: transform 0.15s ease;
  }
  .formas[open] summary::after { transform: rotate(-135deg) translate(-2px, -2px); }
  .formas summary:focus-visible { outline: 2px solid var(--arena-hond); outline-offset: 3px; border-radius: 4px; }
  .formas .lista { display: grid; gap: 13px; padding-top: 14px; }

  .metodo {
    display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
    justify-content: space-between; padding-bottom: 13px; border-bottom: 1px solid var(--linea);
  }
  .metodo:last-child { border-bottom: 0; padding-bottom: 0; }
  .metodo-txt { display: grid; gap: 2px; min-width: 0; flex: 1 1 200px; }
  .metodo b { font-family: var(--texto); font-weight: 600; font-size: 0.93rem; }
  .metodo span { font-size: 0.9rem; color: var(--tinta-sueve); overflow-wrap: anywhere; }
  .pagar {
    font-family: var(--texto); font-weight: 600; font-size: 0.84rem;
    background: var(--tinta); color: #fff; text-decoration: none;
    border-radius: 999px; padding: 8px 20px; white-space: nowrap;
  }
  .pagar:hover { background: #2B2C2E; }
  .pagar:focus-visible { outline: 2px solid var(--arena-hond); outline-offset: 2px; }

  /* ---------- Karina te atiende ----------
     Lo único que brilla en la página es ella: un halo que gira y un pulso
     suave. El cliente pregunta aquí y termina en su WhatsApp. */
  @keyframes gira { to { transform: rotate(360deg); } }
  @keyframes pulso { 0% { box-shadow: 0 0 0 0 rgba(122,158,142,0.45); } 100% { box-shadow: 0 0 0 22px rgba(122,158,142,0); } }
  .karina { background: var(--papel); border: 1px solid var(--linea); border-radius: 16px; padding: 24px; display: grid; gap: 18px; }
  .k-cab { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .halo { position: relative; width: 112px; height: 112px; border-radius: 50%; flex: none; isolation: isolate; }
  .halo::before {
    content: ''; position: absolute; inset: -5px; border-radius: 50%; z-index: -1;
    background: conic-gradient(from 0deg, var(--eucalipto), var(--arena), #fff, var(--eucalipto));
    animation: gira 7s linear infinite;
  }
  .halo::after { content: ''; position: absolute; inset: 0; border-radius: 50%; animation: pulso 2.6s ease-out infinite; }
  .retrato {
    width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--papel);
    background: var(--arena) center 20% / cover no-repeat;
  }
  .retrato.vacia {
    display: grid; place-items: center; font-family: var(--display); font-size: 2.8rem; color: #fff;
    background: linear-gradient(135deg, var(--eucalipto) 0%, var(--eucalipto-h) 100%);
  }
  .burbuja {
    position: relative; flex: 1 1 240px; min-width: 0; background: var(--crema); border-radius: 16px; padding: 14px 18px;
  }
  .burbuja::before { content: ''; position: absolute; left: -8px; top: 26px; border: 8px solid transparent; border-left: 0; border-right-color: var(--crema); }
  .burbuja b { font-family: var(--display); font-weight: 600; font-size: 1.5rem; display: block; line-height: 1.1; margin-bottom: 4px; }
  .burbuja span { color: var(--tinta-sueve); font-size: 0.94rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-family: var(--texto); font-size: 0.88rem; font-weight: 500; color: var(--tinta);
    background: transparent; border: 1px solid var(--linea); border-radius: 999px; padding: 8px 14px; cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .chip:hover, .chip[aria-expanded="true"] { border-color: var(--eucalipto); background: #EAF1ED; }
  .chip-enlace { text-decoration: none; color: var(--eucalipto-h); border-color: var(--eucalipto); border-style: dashed; }
  .respuesta { background: #EAF1ED; border-left: 3px solid var(--eucalipto); border-radius: 0 12px 12px 0; padding: 14px 16px; display: grid; gap: 10px; justify-items: start; }
  .respuesta p { margin: 0; font-size: 0.95rem; }
  .pregunta-libre { display: flex; gap: 8px; align-items: center; }
  .pregunta-libre input { flex: 1 1 220px; font: inherit; font-size: 16px; padding: 11px 14px; border: 1px solid var(--linea); border-radius: 999px; background: var(--papel); color: var(--tinta); min-width: 0; }
  .pregunta-libre input:focus-visible { outline: 2px solid var(--eucalipto); outline-offset: 2px; }
  .wa-ico { width: 18px; height: 18px; fill: currentColor; flex: none; }
  .enlace-wa {
    display: inline-flex; align-items: center; gap: 7px; color: var(--eucalipto-h);
    font-size: 0.9rem; font-weight: 600; text-decoration: none; border-bottom: 1px solid transparent;
  }
  .enlace-wa:hover { border-bottom-color: var(--eucalipto-h); }
  .ico-wa {
    width: 48px; height: 48px; border-radius: 50%; flex: none; display: grid; place-items: center;
    border: 1px solid var(--eucalipto); background: var(--papel); color: var(--eucalipto-h); cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .ico-wa .wa-ico { width: 22px; height: 22px; }
  .ico-wa:hover { background: var(--eucalipto); color: #fff; }
  .boton.con-ico { display: inline-flex; align-items: center; gap: 8px; }
  .boton.primario { background: var(--eucalipto-h); border-color: var(--eucalipto-h); color: #fff; font-size: 0.98rem; padding: 13px 24px; }
  .boton.primario:hover { background: #42665A; }
  /* ---------- modo administrador ----------
     Con sesión, cada sección y cada foto llevan su lápiz: la misma página
     sirve para armar y para editar. */
  .cuerpo section { position: relative; }
  .lapiz {
    position: absolute; top: 0; right: 0; z-index: 2;
    font-family: var(--texto); font-size: 0.74rem; font-weight: 600; letter-spacing: 0.04em;
    background: rgba(255,255,255,0.94); color: var(--eucalipto-h); border: 1px solid var(--eucalipto);
    border-radius: 999px; padding: 5px 11px; cursor: pointer; box-shadow: 0 4px 12px rgba(31,32,36,0.12);
  }
  .lapiz:hover { background: var(--eucalipto); color: #fff; }
  .cabeza .lapiz { top: 14px; right: 14px; }
  .platillo .foto .lapiz { top: 10px; right: 10px; }
  /* Sobre las tarjetas con cifras, el lápiz monta el borde para no tapar números. */
  .lapiz[data-editar="precio"], .lapiz[data-editar="cobro"] { top: -14px; right: 14px; }
  .caja { position: relative; }
  .caja .lapiz { top: 10px; right: 10px; }
  .karina.asistente .retrato.vacia { background: linear-gradient(135deg, #2B3A5C 0%, #1F2024 100%); }
  .karina.asistente .respuesta { background: var(--crema); border-left-color: #2B3A5C; white-space: pre-wrap; }

  /* En angosto el retrato queda arriba de la burbuja; la colita ya no apunta a nada. */
  @media (max-width: 560px) { .burbuja::before { display: none; } }
  @media (prefers-reduced-motion: reduce) { .halo::before, .halo::after { animation: none; } }

  .aprobado {
    display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between;
    background: #EAF1ED; border: 1px solid #BFD4CA; border-left: 4px solid var(--eucalipto);
    border-radius: 12px; padding: 16px 20px;
  }
  .aprobado b { font-family: var(--display); font-size: 1.35rem; display: block; color: var(--eucalipto-h); }
  .aprobado span { color: var(--tinta-sueve); font-size: 0.92rem; }

  /* ---------- Zelle ---------- */
  .zelle { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--linea); padding-top: 16px; }
  .zelle-qr { width: 128px; height: 128px; flex: none; border: 1px solid var(--linea); border-radius: 10px; background: #fff; padding: 6px; image-rendering: pixelated; }
  .zelle-txt { flex: 1 1 240px; min-width: 0; display: grid; gap: 8px; }
  .zelle-txt b { font-family: var(--display); font-size: 1.35rem; font-weight: 600; }
  .zelle-txt p { margin: 0; font-size: 0.93rem; }
  .zelle-txt small { color: var(--tinta-sueve); font-size: 0.82rem; }
  .zelle .acciones { padding-bottom: 0; }

  /* ---------- pie ---------- */

      hoja.innerHTML = '<div class="cuerpo landing">' + cab +
        "<p>Si recibiste una cotización, ábrela desde el enlace que te enviaron.</p>" +

    }
    var grupos = {}, orden = [];
    (estado.cotizaciones || []).forEach(function (c) {
      var tel = soloDigitos(c.telCliente);
      var clave = tel || String(c.cliente || "").trim().toLowerCase() || "—";
      if (!grupos[clave]) { grupos[clave] = { nombre: String(c.cliente || "").trim() || "Sin cliente", tel: tel, lista: [] }; orden.push(clave); }
      grupos[clave].lista.push(c);
    });
    var cuerpo = orden.map(function (k) {
      var g = grupos[k];
      var filas = g.lista.map(function (c) {
        var t = totales(c, "es");
        return '<a class="cot-fila" href="#' + esc(c.slug) + '"><div><b>' + esc(tx(c.titulo, "es")) + "</b><small>" +
          esc([tx(c.fecha, "es"), t.invitados ? t.invitados + " personas" : ""].filter(Boolean).join(" · ")) + "</small></div>" +
          '<div class="cot-der"><span class="cifra-chica">' + esc(dinero(t.total, t.moneda)) + " + IVA</span>" +

      }).join("");
      return '<section class="cliente"><div class="cliente-cab"><div><b>' + esc(g.nombre) + "</b>" +
        (g.tel ? "<small>+" + esc(g.tel) + "</small>" : "") + "</div>" +

    hoja.innerHTML = '<div class="cuerpo landing">' + cab +
      '<div class="acciones"><button type="button" class="agregar" id="btn-nueva-landing">Nueva cotización</button></div></section>' +

  function nuevaCotizacion(base, mismoCliente) {
    var copia = base ? JSON.parse(JSON.stringify(base)) : { invitados: 0, precio: { mxn: 0, usd: 0 } };
    copia.slug = aSlug("cotizacion " + Date.now().toString(36));
    copia.titulo = { es: "Nueva cotización", en: "New quote" };
    if (!mismoCliente) { copia.cliente = ""; copia.telCliente = ""; }
    copia.linkMxn = "";
    copia.linkUsd = "";
    estado.cotizaciones.push(copia);
    estado.activa = copia.slug;
    location.hash = copia.slug; // hashchange → ruta() → pintar()
    abrirPanel();
  }

  /**
   * Redondeo de mostrador: sin centavos, a múltiplos de 5, y los números
   * "redondos" (50, 100, 500…) bajan uno: $99 se ve mejor que $100.
   */
  function redondear(x) {
    var r = Math.round(x / 5) * 5;
    if (r > 0 && r % 50 === 0) r -= 1;
    return r;
  }

  var TIPO_CAMBIO = 16.5;          // pesos por dólar; no se muestra al cliente
  var DESCUENTO_EFECTIVO = 5;      // % por transferencia o efectivo, solo en pesos

  function totales(c, lang) {
    var lado = LADOS[lang];
    var invitados = Number(c.invitados) || 0;
    var precio = c.precio || {};
    var mxn = Number(precio.mxn) || 0;
    var tc = Number(c.tipoCambio) > 0 ? Number(c.tipoCambio) : TIPO_CAMBIO;
    // El dólar sale del precio en pesos, salvo que Karina capture uno a mano.
    var porPersona = lang === "en" ? (Number(precio.usd) || redondear(mxn / tc)) : mxn;
    var total = invitados * porPersona;
    var pct = Number(c.anticipoPct);
    if (!isFinite(pct) || pct < 0 || pct > 100) pct = 50;
    // El IVA es del lado mexicano. En dólares va invoice, sin IVA.
    var iva = lado.conIva ? (isFinite(Number(c.ivaPct)) ? Number(c.ivaPct) : 16) : 0;
    var anticipo = total * pct / 100;
    var anticipoConIva = anticipo * (1 + iva / 100);
    // El descuento es del lado en pesos (transferencia o efectivo). En dólares
    // ya no hay IVA, así que no aplica.
    var dPct = isFinite(Number(c.descuentoEfectivoPct)) ? Number(c.descuentoEfectivoPct) : DESCUENTO_EFECTIVO;
    if (!lado.conIva) dPct = 0;
    return {
      moneda: lado.moneda, invitados: invitados, porPersona: porPersona, total: total,
      pct: pct, iva: iva, anticipo: anticipo, anticipoConIva: anticipoConIva,
      descuentoPct: dPct, anticipoEfectivo: dPct ? redondear(anticipoConIva * (1 - dPct / 100)) : anticipoConIva
    };
  }

  function copiar(texto, listo) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(listo, function () { brindis(texto); });
    } else {
      brindis(texto);
    }
  }

  var QUIETO = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /** Flechas, puntos y avance suave. Se detiene en cuanto el cliente toca. */
  function carrusel() {
    var pista = $("#pista");
    if (!pista) return;
    var tarjetas = pista.children, puntos = hoja.querySelectorAll(".punto");
    function indice() {
      var x = pista.scrollLeft, mejor = 0, dist = Infinity;
      for (var i = 0; i < tarjetas.length; i++) {
        var d = Math.abs(tarjetas[i].offsetLeft - pista.offsetLeft - x);
        if (d < dist) { dist = d; mejor = i; }
      }
      return mejor;
    }
    function ir(i, suave) {
      i = Math.max(0, Math.min(tarjetas.length - 1, i));
      pista.scrollTo({ left: tarjetas[i].offsetLeft - pista.offsetLeft, behavior: suave === false || QUIETO ? "auto" : "smooth" });
    }
    function marcar() {
      var i = indice();
      Array.prototype.forEach.call(puntos, function (p, k) {
        if (k === i) p.setAttribute("aria-current", "true"); else p.removeAttribute("aria-current");
      });
    }
    var reloj = null, usuario = false;
    function parar() { usuario = true; if (reloj) { clearInterval(reloj); reloj = null; } }
    Array.prototype.forEach.call(hoja.querySelectorAll("[data-paso]"), function (b) {
      b.addEventListener("click", function () { parar(); ir(indice() + Number(b.getAttribute("data-paso"))); });
    });
    Array.prototype.forEach.call(puntos, function (p) {
      p.addEventListener("click", function () { parar(); ir(Number(p.getAttribute("data-ir"))); });
    });
    ["pointerdown", "wheel", "touchstart", "keydown"].forEach(function (ev) { pista.addEventListener(ev, parar, { passive: true }); });
    pista.addEventListener("scroll", function () { window.requestAnimationFrame(marcar); }, { passive: true });
    // Avance suave cada 5 s mientras nadie ha tocado y la pestaña está visible.
    if (!QUIETO && tarjetas.length > 1) {
      reloj = setInterval(function () {
        if (document.hidden || usuario) return;
        var i = indice();
        ir(i + 1 >= tarjetas.length ? 0 : i + 1);
      }, 5000);
    }
  }

  /** La portada se mueve un poco más lento que la página. */
  function parallax() {
    var foto = hoja.querySelector(".cabeza .foto");
    if (!foto || QUIETO) return;
    var tope = foto.parentNode;
    function mover() {
      var y = window.scrollY, alto = tope.offsetHeight;
      if (y > alto) return;
      foto.style.translate = "0 " + Math.round(y * 0.22) + "px";
    }
    window.addEventListener("scroll", function () { window.requestAnimationFrame(mover); }, { passive: true });
    mover();
  }

  /* ---------- el asistente del administrador ---------- */
  var hiloAdmin = [], ultimaAdmin = "", asisNombre = "", asisMotor = null;

  function asistente(c, L) {
    var forma = $("#asis-forma");
    if (!forma) return;
    if (!asisNombre) {
      api("/silver/chat").then(function (st) {
        var p = st.proveedores && st.proveedores[st.predeterminado];
        if (!p) return;
        asisNombre = p.nombre; asisMotor = st.predeterminado;
        var n = $("#asis-nombre"), i = $("#asis-inicial");
        if (n) n.textContent = asisNombre;
        if (i) i.textContent = asisNombre.charAt(0);
      }).catch(function () { /* sin llave: el primer pedido lo dirá */ });
    }
    Array.prototype.forEach.call(hoja.querySelectorAll("[data-pedir]"), function (b) {
      b.addEventListener("click", function () { pedir(c, L, b.getAttribute("data-pedir")); });
    });
    forma.addEventListener("submit", function (e) {
      e.preventDefault();
      var v = $("#asis-entrada").value.trim();
      if (v) { $("#asis-entrada").value = ""; pedir(c, L, v); }
    });

  /** Un pedido al asistente. Si vuelve con cambios, se aplican en pantalla y Karina decide si guarda. */
  function pedir(c, L, texto) {
    var caja = $("#asis-respuesta"), p = $("#asis-texto"), boton = $("#asis-enviar");
    hiloAdmin.push({ role: "user", content: texto });
    hiloAdmin = hiloAdmin.slice(-20);
    if (caja) { caja.hidden = false; p.textContent = (asisNombre || "Silver") + " está pensando…"; }
    if (boton) boton.disabled = true;
    api("/silver/chat", {
      method: "POST",
      body: JSON.stringify({ messages: hiloAdmin, proveedor: asisMotor || undefined,
        contexto: { cotizacion: c, chef: estado.chef || {}, idioma: L } }),
    })
      .then(function (out) {
        hiloAdmin.push({ role: "assistant", content: out.reply || "" });
        ultimaAdmin = [out.reply].concat(out.notas || []).filter(Boolean).join("\n");
        if (out.cambios && typeof out.cambios === "object") {
          Object.keys(out.cambios).forEach(function (k) {
            var v = out.cambios[k];
            if (k === "precio" && v && typeof v === "object") c.precio = Object.assign(c.precio || {}, v);
            else c[k] = v;
          });
          brindis("Cambios aplicados en pantalla. Revisa y pulsa Guardar.");
          llenarSelector(); pintar();
        } else if (p) {
          p.textContent = ultimaAdmin;
        }
      })
      .catch(function (e) { if (p) p.textContent = e.message; })
      .then(function () { var b = $("#asis-enviar"); if (b) b.disabled = false; });
  }

  /** Karina te atiende: cada pregunta muestra su respuesta y ofrece seguir por WhatsApp. */
  /* El cliente tiene a Karina abajo a la derecha: un retrato que brilla y,
     al abrirlo, cuatro caminos (pagar, menú, otras dudas, WhatsApp). Vive en
     <body>, fuera de la hoja, para que ningún transform de la animación lo mueva. */
  function lanzador(c, t, t9, L, chef, hrefPagar) {
    var viejo = document.getElementById("k-lanzador");
    if (viejo) viejo.remove();
    if (esAdmin() || !chef.whatsapp) return;
    var wa = soloDigitos(chef.whatsapp);
    function enlaceWa(m) { return "https://wa.me/" + wa + "?text=" + encodeURIComponent(t9.sobreCot + " " + tx(c.titulo, L) + ": " + m); }
    var preguntas = (chef.preguntas && chef.preguntas.length ? chef.preguntas : PREGUNTAS_BASE);
    function tema(q) { return q.tema || (/men[uú]|platill|porci|vegetari|gluten|dish|portion|vegan/i.test(tx(q.nombre, "es") + " " + tx(q.nombre, "en")) ? "menu" : "otras"); }
    var inicial = esc(String(chef.nombre || "K").replace(/^chef\s+/i, "").charAt(0));
    var retrato = chef.foto
      ? '<span class="retrato" style="background-image:url(' + "'" + esc(chef.foto) + "'" + ')"></span>'
      : '<span class="retrato vacia">' + inicial + "</span>";
    var flecha = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    var raiz = document.createElement("div");
    raiz.id = "k-lanzador";
    raiz.className = "k-lanzador";
    raiz.innerHTML =
      '<div class="k-panel" id="k-panel" role="dialog" aria-label="' + esc(t9.kAbrir) + '" hidden>' +
        '<div class="k-panel-cab"><span class="halo chico">' + retrato + "</span>" +
          '<div><b>' + esc(t9.holaSoy) + "</b><span>" + esc(t9.ayudar) + "</span></div>" +
          '<button type="button" class="k-cerrar" aria-label="' + esc(t9.kCerrar) + '">×</button></div>' +
        '<div class="k-vista" data-vista="inicio">' +
          (hrefPagar ? '<a class="k-opcion fuerte" target="_blank" rel="noopener" href="' + esc(hrefPagar) + '"><span>' + esc(t9.kPagar) +
            "<small>" + dinero(t.anticipoConIva, t.moneda) + "</small></span>" + flecha + "</a>" : "") +
          '<button type="button" class="k-opcion" data-ir="menu"><span>' + esc(t9.kMenu) + "</span>" + flecha + "</button>" +
          '<button type="button" class="k-opcion" data-ir="otras"><span>' + esc(t9.kOtras) + "</span>" + flecha + "</button>" +
          '<a class="k-opcion" target="_blank" rel="noopener" href="https://wa.me/' + esc(wa) + "?text=" +
            encodeURIComponent(t9.kHablarWa + " " + tx(c.titulo, L) + ".") + '"><span class="con-ico">' + WA_SVG + esc(t9.kHablar) + "</span>" + flecha + "</a>" +
        "</div>" +
        ["menu", "otras"].map(function (v) {
          var chips = preguntas.map(function (q, i) { return tema(q) === v ? '<button type="button" class="chip" data-faq="' + i + '" aria-expanded="false">' + esc(tx(q.nombre, L)) + "</button>" : ""; }).join("");
          return '<div class="k-vista" data-vista="' + v + '" hidden>' +
            '<button type="button" class="k-volver" data-ir="inicio">‹ ' + esc(t9.kVolver) + "</button>" +
            '<div class="k-titulo">' + esc(v === "menu" ? t9.kMenu : t9.kOtras) + "</div>" +
            (chips ? '<div class="chips">' + chips + "</div>" : "") +
            '<div class="respuesta" hidden><p></p><a class="enlace-wa" target="_blank" rel="noopener" href="#">' + WA_SVG + esc(t9.preguntarWa) + "</a></div>" +
            '<form class="pregunta-libre"><input type="text" placeholder="' + esc(t9.tuPregunta) + '" maxlength="300" required aria-label="' + esc(t9.tuPregunta) + '">' +
              '<button type="submit" class="ico-wa" aria-label="' + esc(t9.enviarWa) + '" title="' + esc(t9.enviarWa) + '">' + WA_SVG + "</button></form>" +
          "</div>";
        }).join("") +
      "</div>" +
      '<span class="k-teaser" aria-hidden="true">' + esc(t9.kTeaser) + "</span>" +
      '<button type="button" class="k-boton" aria-expanded="false" aria-controls="k-panel" aria-label="' + esc(t9.kAbrir) + '">' +
        '<span class="halo">' + retrato + "</span></button>";
    document.body.appendChild(raiz);

    var panel = raiz.querySelector(".k-panel"), boton = raiz.querySelector(".k-boton");
    function ir(v) {
      Array.prototype.forEach.call(raiz.querySelectorAll(".k-vista"), function (x) { x.hidden = x.getAttribute("data-vista") !== v; });
      var foco = raiz.querySelector('.k-vista[data-vista="' + v + '"] .k-opcion, .k-vista[data-vista="' + v + '"] .chip, .k-vista[data-vista="' + v + '"] input');
      if (foco) foco.focus();
    }
    function abrir(si) {
      panel.hidden = !si;
      boton.setAttribute("aria-expanded", String(si));
      raiz.classList.toggle("abierto", si);
      if (si) ir("inicio"); else boton.focus();
    }
    boton.addEventListener("click", function () { abrir(panel.hidden); });
    raiz.querySelector(".k-cerrar").addEventListener("click", function () { abrir(false); });
    raiz.addEventListener("keydown", function (e) { if (e.key === "Escape" && !panel.hidden) abrir(false); });
    Array.prototype.forEach.call(raiz.querySelectorAll("[data-ir]"), function (b) {
      b.addEventListener("click", function () { ir(b.getAttribute("data-ir")); });

    Array.prototype.forEach.call(raiz.querySelectorAll(".k-vista[data-vista='menu'], .k-vista[data-vista='otras']"), function (vista) {
      var caja = vista.querySelector(".respuesta");
      Array.prototype.forEach.call(vista.querySelectorAll("[data-faq]"), function (b) {
        b.addEventListener("click", function () {

          Array.prototype.forEach.call(vista.querySelectorAll("[data-faq]"), function (x) { x.setAttribute("aria-expanded", "false"); });

          b.setAttribute("aria-expanded", "true");
          caja.querySelector("p").textContent = tx(q.detalle, L).replace("{p}", t.pct);
          caja.querySelector("a").href = enlaceWa(tx(q.nombre, L));
          caja.hidden = false;
        });
      });
      vista.querySelector("form").addEventListener("submit", function (e) {
        e.preventDefault();
        var v = vista.querySelector("input").value.trim();
        if (v) window.open(enlaceWa(v), "_blank", "noopener");
      });
    });
  }

  /* ---------- enviar al cliente ---------- */

  /** wa.me solo acepta dígitos: sin +, sin espacios, sin guiones. */
  function soloDigitos(s) { return String(s || "").replace(/\D/g, ""); }

  /**
   * El enlace que se le manda al cliente. Dentro del visor, `location` apunta
   * al marco interno y no al enlace que se comparte, así que si Karina guardó
   * la URL pública se usa esa; si no, se cae a la actual, que sirve mientras
   * ella misma lo prueba.
   */
  function enlacePublico(slug) {
    var base = String((estado.chef || {}).urlPublica || "").trim().replace(/#.*$/, "");
    if (!/^https:\/\//i.test(base)) base = location.origin + location.pathname;
    return base.replace(/\?.*$/, "") + "?c=" + encodeURIComponent(slug);
  }

  /** Archivo .ics con el evento, si Karina capturó inicio (y fin). */
  function icsUrl(c, L) {
    if (!c.inicio) return "";
    function fmt(v) { return String(v).replace(/[-:]/g, "").slice(0, 15); }
    var fin = c.fin || c.inicio;
    var lineas = [
      "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//KPK Wellness//Cotizador//ES", "BEGIN:VEVENT",
      "UID:" + c.slug + "@kpk.associates",
      "DTSTART:" + fmt(c.inicio), "DTEND:" + fmt(fin),
      "SUMMARY:" + tx(c.titulo, L) + " · Chef Karina Paz Kennedy",
      "LOCATION:" + tx(c.lugar, L),
      "DESCRIPTION:" + enlacePublico(c.slug),
      "END:VEVENT", "END:VCALENDAR"
    ];
    return "data:text/calendar;charset=utf-8," + encodeURIComponent(lineas.join("\r\n"));
  }

  function enviarAlCliente() {
    var c = cotizacionActiva();
    if (!c) return;
    var tel = soloDigitos(c.telCliente);
    if (!tel) {
      brindis("Falta el WhatsApp del cliente. Está en Editar → Evento.");
      abrirPanel();
      return;
    }
    var L = idioma;
    var nombre = String(c.cliente || "").split(" ")[0];
    var titulo = tx(c.titulo, L);
    var enlace = enlacePublico(c.slug);
    var texto = L === "en"
      ? "Hi " + nombre + ", here's the quote for " + titulo + ":\n" + enlace
      : "Hola " + nombre + ", te comparto la cotización para " + titulo + ":\n" + enlace;
    // Se abre el chat con el mensaje escrito; ella lo revisa y le da enviar.
    window.open("https://wa.me/" + tel + "?text=" + encodeURIComponent(texto), "_blank", "noopener");
  }

        '<div class="acciones">' +
          (valor ? '<button type="button" class="agregar" data-ia="editar" data-ruta="' + esc(ruta) + '">Editar esta foto</button>' : "") +
          '<button type="button" class="agregar" data-ia="generar" data-ruta="' + esc(ruta) + '">Generar nueva</button>' +

  function listaPares(titulo, clave, items, l1, l2, conFoto) {
    return "<fieldset><legend>" + esc(titulo) + "</legend>" +
      (items || []).map(function (o, i) {
        var n = o.nombre && typeof o.nombre === "object" ? o.nombre : { es: o.nombre || "", en: "" };
        var d = o.detalle && typeof o.detalle === "object" ? o.detalle : { es: o.detalle || "", en: "" };

  /* ---------- historial de platillos ----------

  function idPlatillo(p) { return aSlug(tx(p && p.nombre, "es") || tx(p && p.nombre, "en") || ""); }
  function guardarEnCatalogo(p) {
    var id = idPlatillo(p);
    if (!id) return;
    estado.catalogo = estado.catalogo || [];
    var copia = { id: id, nombre: JSON.parse(JSON.stringify(p.nombre || { es: "", en: "" })), detalle: JSON.parse(JSON.stringify(p.detalle || { es: "", en: "" })), imagen: p.imagen || "" };
    var i = estado.catalogo.findIndex(function (x) { return x.id === id; });
    if (i >= 0) estado.catalogo[i] = copia; else estado.catalogo.push(copia);
  }
  function actualizarCatalogo() {
    (estado.cotizaciones || []).forEach(function (c) { (c.menu || []).forEach(guardarEnCatalogo); });
  }
  function historialMenu(items) {
    var enMenu = (items || []).map(idPlatillo);

      if (partes[0] === "chef") { o = estado.chef = estado.chef || {}; partes.shift(); }

      detalle: { es: "Con el anticipo del {p}%. El resto se liquida el día del evento.", en: "With the {p}% deposit. The balance is due on the day of the event." } },
    { tema: "menu", nombre: { es: "¿Puedo cambiar el menú?", en: "Can I change the menu?" },
      detalle: { es: "Sí. Dime qué te gustaría y te propongo opciones al mismo precio, o te cotizo el cambio.", en: "Yes. Tell me what you'd like and I'll suggest options at the same price, or quote the change." } },
    { tema: "menu", nombre: { es: "¿Hay opción vegetariana o sin gluten?", en: "Vegetarian or gluten-free options?" },
      detalle: { es: "Sí. Dime cuántas personas y adapto el menú.", en: "Yes. Tell me how many guests and I'll adapt the menu." } },
    { tema: "menu", nombre: { es: "¿Las porciones son como en las fotos?", en: "Are portions like the photos?" },
      detalle: { es: "Las fotos son representativas del tipo de platillo. El tamaño y la presentación pueden variar; pregúntame y te explico cantidades.", en: "The photos show the type of dish. Size and presentation may vary; ask me and I'll walk you through portions." } },
    { nombre: { es: "¿Incluye meseros?", en: "Are servers included?" },
      detalle: { es: "Se cotizan aparte. Te recomiendo cuántos según tu grupo.", en: "They're quoted separately. I'll recommend how many for your group." } },
    { nombre: { es: "¿Y si cambio la fecha?", en: "What if I change the date?" },
      detalle: { es: "Avísame cuanto antes. Si hay disponibilidad, el anticipo se mueve a la nueva fecha.", en: "Let me know as soon as you can. If the new date is open, the deposit moves with it." } }
  ];

  /* Mientras Karina no suba su propia portada, se usa esta. */
  var PORTADA_PREDETERMINADA = "assets/cotizaciones/portada-rosarito.webp";
  var AUTH = null; // { token, email } cuando hay sesión de admin
  // "Ver como cliente": con sesión, la página se pinta exactamente como la ve el cliente.
  var VISTA_CLIENTE = new URLSearchParams(location.search).get("vista") === "cliente";
  function esAdmin() { return Boolean(AUTH) && !VISTA_CLIENTE; }

  function api(ruta, opciones) {
    var o = opciones || {};
    o.headers = Object.assign({ "content-type": "application/json" }, o.headers || {});
    if (AUTH) o.headers.authorization = "Bearer " + AUTH.token;
    return fetch("/api" + ruta, o).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (b) {
        if (!r.ok) throw new Error(b.error || "Error " + r.status);
        return b;
      });
    });
  }

  function guardar() {
    var boton = $("#btn-guardar");
    if (boton) { boton.disabled = true; boton.textContent = "Guardando…"; }
    actualizarCatalogo();
    api("/commit", {
      method: "POST",
      body: JSON.stringify({
        path: RUTA_DATOS,
        content: JSON.stringify(estado, null, 2) + "\n",
        message: "cotizaciones: " + (cotizacionActiva() || {}).slug,
      }),
    })
      .then(function () {
        // El sitio se reconstruye con el commit; el cambio tarda un momento
        // en verse en la dirección pública.
        brindis("Guardado. El sitio se actualiza en un minuto.");
      })
      .catch(function (e) { brindis(e.message); })
      .finally(function () {
        if (boton && boton.isConnected) { boton.disabled = false; boton.textContent = "Guardar"; }
      });
  }

  /**
   * Sube una foto desde el teléfono: se reduce aquí mismo (máx. 1400 px, WebP)
   * para que un original de 8 MB no viaje ni se quede en el repo, y se
   * commitea en assets/cotizaciones/. Aparece en el sitio con el siguiente deploy.
   */
  function subirFoto(archivo, ruta, listo) {
    var img = new Image(), urlLocal = URL.createObjectURL(archivo);
    img.onload = function () {
      var max = 1400, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
      var canvas = document.createElement("canvas");
      canvas.width = Math.round(w * k); canvas.height = Math.round(h * k);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(urlLocal);
      var tipo = "image/webp";
      canvas.toBlob(function (blob) {
        if (!blob) { tipo = "image/jpeg"; canvas.toBlob(mandar, tipo, 0.84); return; }
        mandar(blob);
      }, tipo, 0.82);
      function mandar(blob) {
        var lector = new FileReader();
        lector.onload = function () {
          var b64 = String(lector.result).split(",")[1];
          var ext = tipo === "image/webp" ? "webp" : "jpg";
          var slug = (cotizacionActiva() || {}).slug || "cotizacion";
          var rutaRepo = "assets/cotizaciones/" + slug + "-" + aSlug(ruta) + "-" + Date.now().toString(36) + "." + ext;
          brindis("Subiendo foto…");
          api("/commit", {
            method: "POST",
            body: JSON.stringify({ path: rutaRepo, content: b64, isBase64: true, message: "foto: " + slug + " " + ruta }),
          }).then(function () {
            listo(rutaRepo);
            brindis("Foto subida. Guarda la cotización para publicarla.");
          }).catch(function (e) { brindis(e.message); });
        };
        lector.readAsDataURL(blob);
      }
    };
    img.onerror = function () { brindis("No pude leer esa imagen."); };
    img.src = urlLocal;
  }

  /** Pide el cobro a Mercado Pago y guarda la URL en la cotización. */
  function generarCobro(lado) {
    var c = cotizacionActiva();
    if (!c) return;
    var t = totales(c, lado);
    if (!t.porPersona) { brindis("Falta el precio por persona de ese lado."); return; }

    var monto = lado === "es" ? t.anticipoConIva : t.anticipo;
    var concepto = "Anticipo " + t.pct + "% - " + tx(c.titulo, lado) + (c.cliente ? " - " + c.cliente : "");
    var boton = $("#btn-cobro-" + lado);
    if (boton) { boton.disabled = true; boton.textContent = "Creando…"; }
    var back = location.origin + location.pathname + "?c=" + encodeURIComponent(c.slug);

    function cobro(importe, extra) {
      return api(lado === "es" ? "/payments/charge" : "/payments/stripe", {
        method: "POST",
        body: JSON.stringify(Object.assign({
          concept: concepto.slice(0, 240),
          // En centavos enteros, redondeados aquí y no en el servidor.
          amount_cents: Math.round(importe * 100),
          currency: t.moneda,
          reference: c.slug,
          back_url: back,
        }, extra || {})),
      });
    }

    // En pesos salen dos links: tarjeta al precio completo, y transferencia o
    // efectivo con el descuento, con la tarjeta cerrada para ese link.
    var conDescuento = lado === "es" && t.descuentoPct > 0;
    cobro(monto)
      .then(function (r) {
        c[LADOS[lado].link] = r.pay_url || "";
        if (!r.live_mode) brindis("Ojo: se creó con credencial de PRUEBA. No cobra.");
        if (!conDescuento) return null;
        return cobro(t.anticipoEfectivo, {
          concept: (concepto + " - transferencia/efectivo").slice(0, 240),
          excluded_payment_types: ["credit_card", "debit_card", "prepaid_card"],
        }).then(function (r2) { c.linkMxnEfectivo = r2.pay_url || ""; });
      })
      .then(function () {
        brindis("Cobro creado por " + dinero(monto, t.moneda) +
          (conDescuento ? " y " + dinero(t.anticipoEfectivo, t.moneda) + " con descuento" : "") + ". Falta Guardar.");
        cerrarPanel(); abrirPanel();
      })
      .catch(function (e) {
        brindis(e.message);
        // El aviso de 3 segundos se pierde; esto se queda escrito hasta que se cierre el panel.
        var est = $("#cobro-estado");
        if (est) { est.textContent = "No se pudo generar el cobro: " + e.message + " (ya quedó reportado como ticket)"; est.style.borderLeftColor = "#C79A91"; est.style.color = "#9A5A4F"; }
        // Y se reporta solo: así el motivo llega aunque nadie lo copie.
        api("/tickets", { method: "POST", body: JSON.stringify({
          tipo: "falla", titulo: "Generar cobros falló: " + String(e.message).slice(0, 80),
          detalle: "Cotización: " + c.slug + "\nLado: " + lado + "\nMonto: " + monto + " " + t.moneda + "\nError: " + e.message + "\nNavegador: " + navigator.userAgent,
          pagina: location.href, dispositivo: navigator.userAgent,
        }) }).catch(function () { /* si tampoco se puede, el texto ya quedó en pantalla */ });
      })
      .finally(function () {
        if (boton && boton.isConnected) { boton.disabled = false; boton.textContent = lado === "es" ? "Generar cobros" : "Generar cobro en dólares"; }
      });
  }

  /* ---------- arranque ---------- */

  function cargarDatos() {
    return fetch(RUTA_DATOS + "?t=" + Date.now())
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (d && Array.isArray(d.cotizaciones)) estado = d;
      })
      .catch(function () { /* todavía no existe el archivo */ });
  }

  function sesionGuardada() {
    try {
      var s = JSON.parse(localStorage.getItem("kpk_auth") || "null");
      return s && s.token ? s : null;
    } catch (e) { return null; }
  }

  cargarDatos().then(function () {
    ruta();
    window.addEventListener("hashchange", ruta);
    hoja.addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest("[data-nueva-para],#btn-nueva-landing") : null;
      if (!b || !AUTH) return;
      var ref = b.dataset.nuevaPara ? estado.cotizaciones.filter(function (c) { return c.slug === b.dataset.nuevaPara; })[0] : null;
      nuevaCotizacion(ref || estado.cotizaciones[0], Boolean(ref));
    });

    // La barra de admin solo aparece con una sesión que el servidor confirme.
    // Un token viejo en el navegador no alcanza.
    var s = sesionGuardada();
    if (!s) return;
    AUTH = s;
    api("/session").then(function () { barraAdmin(); if (enCotizacion()) pintar(); else pintarLanding(true); }).catch(function () {
      AUTH = null;
      localStorage.removeItem("kpk_auth");
    });
  });

  window.addEventListener("hashchange", function () { pintar(); llenarSelector(); });
}());
</script>
